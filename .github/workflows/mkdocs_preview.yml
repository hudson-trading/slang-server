name: Deploy PR Preview to gh-pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/mkdocs*.yml'
      - '**/mkdocs*.yaml'
      - 'scripts/ci/publish-docs.sh'
      - 'tests/ci/test_publish_docs.py'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to publish the selected ref under
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Install a specific version of uv.
          version: '0.8.17'
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build docs
        run: uv run mkdocs build
      - name: Deploy to gh-pages preview directory
        env:
          PREVIEW_DIR: previews/pr-${{ github.event.pull_request.number || inputs.pr_number }}
        run: bash scripts/ci/publish-docs.sh site "$PREVIEW_DIR"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const previewUrl = `https://hudson-trading.github.io/slang-server/previews/pr-${{ github.event.number }}/`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📖 Documentation preview deployed: ${previewUrl}`
            });
