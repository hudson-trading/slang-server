name: CI Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_artifacts:
        description: 'Upload build artifacts'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Git ref to checkout (branch, tag, or commit)'
        required: false
        type: string
        default: ''
  push:
    branches: [main, ci-test]
    paths-ignore:
      - 'docs/**'
      - 'clients/vscode/**'
      - '*.md'
      - 'mkdocs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'clients/vscode/**'
      - '*.md'
      - 'mkdocs.yaml'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical Linux release builds: built in manylinux_2_28 (glibc 2.28)
          # so binaries run on older distros (RHEL/Rocky/Alma 8, Debian 10, etc.).
          - name: linux-x64
            preset: gcc-release
            os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            cmake_args: -DCMAKE_CXX_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/g++
          - name: linux-arm64
            preset: gcc-release
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            cmake_args: -DCMAKE_CXX_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/g++
          # Dev-only Linux builds for additional compiler/host coverage.
          # OS is in the name to distinguish from the canonical release builds.
          - name: linux-x64-ubuntu-24.04-clang
            preset: clang-release
            os: ubuntu-24.04
            skip_upload: true
          - name: linux-arm64-ubuntu-24.04-clang
            preset: clang-release
            os: ubuntu-24.04-arm
            skip_upload: true
          - name: linux-x64-ubuntu-24.04-clang-debug
            preset: clang-debug
            os: ubuntu-24.04
            skip_pytests: true
            skip_neovim_tests: true
            skip_upload: true
          - name: linux-x64-ubuntu-24.04-gcc
            preset: gcc-release
            os: ubuntu-24.04
            skip_upload: true
          - name: macos
            preset: macos-release
            os: macos-15
          - name: windows-x64
            preset: win64-release
            os: windows-latest
          - name: windows-arm64
            preset: winarm64-release
            os: windows-11-arm

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      SLANG_SERVER_ARTIFACT_NAME: slang-server-${{ matrix.name }}
    steps:
      - name: Install dependencies (manylinux_2_28)
        if: startsWith(matrix.container, 'quay.io/pypa/manylinux_2_28')
        run: |
          # manylinux_2_28 already provides gcc-toolset-14, cmake, make, git, python.
          # Only need gcc-toolset-14-libatomic-devel for the atomic intrinsics.
          dnf -y install gcc-toolset-14-libatomic-devel
          cmake --version
      - name: Install Clang 21 (Ubuntu)
        if: startsWith(matrix.preset, 'clang-')
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-21
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: 'latest'

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSLANG_CI_BUILD=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} -j8

      - name: Run ctest
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error -j8

      - name: Set up uv
        if: matrix.skip_pytests != true
        uses: astral-sh/setup-uv@v6

      - name: Run pytest (Linux/macOS)
        if: runner.os != 'Windows' && matrix.skip_pytests != true
        run: |
          uv venv
          source .venv/bin/activate
          uv sync
          pytest tests/system/ --binary build/${{ matrix.preset }}/bin/slang-server

      - name: Run pytest (Windows)
        if: runner.os == 'Windows' && matrix.skip_pytests != true
        run: |
          uv venv
          .venv\Scripts\activate
          uv sync
          pytest tests\system\ --binary build\${{ matrix.preset }}\bin\slang-server.exe

      - name: Set up Neovim
        if: runner.os != 'Windows' && matrix.container == '' && matrix.skip_neovim_tests != true
        uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: true

      - name: Set up Lua and LuaRocks
        if: runner.os != 'Windows' && matrix.container == '' && matrix.skip_neovim_tests != true
        shell: bash
        run: |
          lua_prefix="${RUNNER_TEMP}/lua-5.1.5-install"
          lua_archive="${RUNNER_TEMP}/lua-5.1.5.tar.gz"
          lua_source="${RUNNER_TEMP}/lua-5.1.5"

          curl --fail --location --retry 5 --retry-all-errors \
            https://deb.debian.org/debian/pool/main/l/lua5.1/lua5.1_5.1.5.orig.tar.gz \
            --output "${lua_archive}"
          echo "2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333  ${lua_archive}" | shasum -a 256 --check
          tar -xzf "${lua_archive}" -C "${RUNNER_TEMP}"

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            brew install luarocks readline
            readline_prefix="$(brew --prefix readline)"
            make -C "${lua_source}/src" all \
              MYCFLAGS="-DLUA_USE_LINUX -I${readline_prefix}/include" \
              MYLIBS="-L${readline_prefix}/lib -lreadline"
          else
            sudo apt-get update
            sudo apt-get install -y libreadline-dev luarocks
            make -C "${lua_source}" linux
          fi

          make -C "${lua_source}" install INSTALL_TOP="${lua_prefix}"
          echo "${lua_prefix}/bin" >> "${GITHUB_PATH}"
          echo "LUA_PREFIX=${lua_prefix}" >> "${GITHUB_ENV}"

      - name: Run Neovim plugin tests
        if: runner.os != 'Windows' && matrix.container == '' && matrix.skip_neovim_tests != true
        shell: bash
        env:
          SLANG_SERVER_BIN: ../../build/${{ matrix.preset }}/bin/slang-server
        run: |
          luarocks --lua-version=5.1 --lua-dir="${LUA_PREFIX}" --tree="${LUA_PREFIX}" test \
            clients/neovim/slang-server.nvim-scm-1.rockspec \
            --test-type busted -- -C clients/neovim/

      - name: Package release artifact
        if: inputs.upload_artifacts && !matrix.skip_upload
        shell: bash
        run: |
          mkdir -p release-artifacts

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp build/${{ matrix.preset }}/bin/slang-server.exe release-artifacts/slang-server.exe
          else
            cp build/${{ matrix.preset }}/bin/slang-server release-artifacts/slang-server
            chmod +x release-artifacts/slang-server
            if [[ "${RUNNER_OS}" == "Linux" ]]; then
              strip release-artifacts/slang-server
            fi
          fi

          cat > release-artifacts/README.txt <<EOF
          Slang Server - SystemVerilog Language Server

          This is a pre-built binary of slang-server.

          Installation:
          1. Extract this archive
          2. Add the binary to your PATH, or
          3. Configure your editor to use the absolute path to this binary

          For more information, visit:
          https://github.com/hudson-trading/slang-server

          Platform: ${{ env.SLANG_SERVER_ARTIFACT_NAME }}
          Build date: $(date -u +%Y-%m-%d)
          EOF

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            (cd release-artifacts && 7z a ../${{ env.SLANG_SERVER_ARTIFACT_NAME }}.zip *)
          else
            tar -czf ${{ env.SLANG_SERVER_ARTIFACT_NAME }}.tar.gz -C release-artifacts .
            if [[ "${{ matrix.name }}" == "linux-x64" ]]; then
              cp ${{ env.SLANG_SERVER_ARTIFACT_NAME }}.tar.gz slang-server-old-linux-x64-gcc.tar.gz
            elif [[ "${{ matrix.name }}" == "linux-arm64" ]]; then
              cp ${{ env.SLANG_SERVER_ARTIFACT_NAME }}.tar.gz slang-server-linux-arm64-clang.tar.gz
            fi
          fi

      - name: Upload artifact
        if: inputs.upload_artifacts && !matrix.skip_upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLANG_SERVER_ARTIFACT_NAME }}
          path: |
            ${{ env.SLANG_SERVER_ARTIFACT_NAME }}.tar.gz
            ${{ env.SLANG_SERVER_ARTIFACT_NAME }}.zip
            slang-server-old-linux-x64-gcc.tar.gz
            slang-server-linux-arm64-clang.tar.gz
          retention-days: 7
